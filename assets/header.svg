<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2433"/>
      <stop offset="100%" stop-color="#0E1623"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#2A3A4F" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
    <radialGradient id="glow" cx="30%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1E2B3D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B111B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E1623" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#0E1623" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0E1623" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <rect width="1200" height="360" fill="url(#fade)"/>

  <text x="76" y="178"
        font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="68" font-weight="600" letter-spacing="4" fill="#F4F6F8">SONG DAEHYEON</text>

  <rect x="76" y="210" width="160" height="4" rx="2" fill="#2BA3A8"/>

  <text x="78" y="262"
        font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="500" letter-spacing="4.5" fill="#8A96A6">DEVOPS  /  INFRASTRUCTURE ENGINEER</text>
</svg>
